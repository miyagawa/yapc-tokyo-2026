name: Refresh timetable
on:
  workflow_dispatch:
  schedule:
    # hourly, 07:00 JST 11/28 – 19:00 JST 11/29 only (cron is UTC)
    - cron: '0 22,23 27 11 *'
    - cron: '0 * 28 11 *'
    - cron: '0 0-10 29 11 *'
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Only in 2026
        if: github.event_name == 'schedule'
        run: '[ "$(date -u +%Y)" = 2026 ] || { echo "event is over"; exit 1; }'
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch.py
      - name: Commit if changed
        run: |
          # ignore DTSTAMP / fetched_at-only changes
          if git diff --quiet -I '^DTSTAMP:' -- ics && \
             [ "$(git show HEAD:data/timetable.json | python3 -c 'import json,sys;print(json.dumps(json.load(sys.stdin)["events"]))')" = "$(python3 -c 'import json;print(json.dumps(json.load(open("data/timetable.json"))["events"]))')" ]; then
            echo "no changes"; exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A data ics
          git commit -m "Refresh timetable from fortee"
          git push
